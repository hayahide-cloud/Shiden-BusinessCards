<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiden Cards</title>
<!-- アイコン: 共通バッジ（docs/SHIDEN_ICON_GUIDE.md。閲覧専用ページなので PWA 化はしない） -->
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="theme-color" content="#09060f">
<style>
  /* ================================================================
     Shiden Cards — 名刺一覧（閲覧専用）
     Shiden Dashboard と同じダーク×紫テーマ。
     実データは Hayahide-Log（非公開）から実行時に読む。HTML は何も持たない。
     ================================================================ */
  :root {
    --page:        #0c0a11;
    --surface:     #16131d;
    --surface-2:   #1d1926;
    --ink:         #f2f0f7;
    --ink-2:       #b8b3c7;
    --muted:       #7d7890;
    --border:      rgba(158,140,255,0.14);
    --accent:      #9085e9;
    --accent-hi:   #b5aaff;
    --accent-soft: rgba(144,133,233,0.12);
    --good:        #34c85a;
    --warn:        #e6a040;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    background:
      radial-gradient(1000px 500px at 80% -10%, rgba(120,90,240,0.16), transparent 60%),
      radial-gradient(800px 400px at -10% 20%, rgba(90,60,200,0.10), transparent 60%),
      var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    line-height: 1.6;
    padding: 28px 16px 64px;
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 32px; height: 32px; }
  .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.02em; }
  .brand .sub { color: var(--muted); font-size: 12px; }
  .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .status { color: var(--muted); font-size: 12px; }
  button, select, input {
    font: inherit; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0c0a11; font-weight: 600; border-color: transparent; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }

  /* 設定パネル */
  .panel { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
  .panel.open { display: block; }
  .panel h2 { font-size: 14px; margin-bottom: 10px; color: var(--ink-2); }
  .panel .row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
  .panel .row input { width: 100%; }
  .panel .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .panel .actions { display: flex; gap: 8px; margin-top: 10px; }

  /* フィルタ列 */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .filters input[type=search] { flex: 1 1 220px; min-width: 180px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--ink-2); cursor: pointer;
  }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-hi); }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; }

  /* カード */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .thumb { aspect-ratio: 1.65; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 10px 12px 12px; }
  .company { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .name { font-size: 15px; font-weight: 700; color: var(--accent-hi); margin: 2px 0 6px; line-height: 1.35; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2); }
  .tag.folder { border-color: rgba(52,200,90,0.35); color: #7fe09a; }
  .date { font-size: 11px; color: var(--muted); margin-top: 6px; }

  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .section-title { font-size: 13px; color: var(--ink-2); font-weight: 600; margin: 18px 0 8px; }

  /* 拡大表示 */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10; align-items: center; justify-content: center; padding: 20px; }
  .modal.open { display: flex; }
  .modal .box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; max-width: 960px; width: 100%; max-height: 95vh; overflow: auto; }
  /* 画像は高さを抑えて、下の編集フォームがスクロールなしで見えるようにする */
  .modal img { width: 100%; max-height: 42vh; object-fit: contain; display: block; background: #fff; }
  .modal .meta { padding: 12px 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .modal .meta .name { font-size: 18px; margin: 0; }
  .modal .meta .close { margin-left: auto; }
  .modal .file { font-size: 12px; color: var(--muted); word-break: break-all; }

  @media (max-width: 480px) {
    body { padding: 16px 12px 48px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  }

  /* 編集フォーム（拡大表示の下） */
  .form { padding: 4px 16px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-2); }
  .form label.wide { grid-column: 1 / -1; }
  .form input, .form textarea { width: 100%; }
  .form textarea { min-height: 64px; resize: vertical; font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  .form .hint { font-size: 11px; color: var(--muted); }
  .form-actions { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .form-actions .msg { font-size: 12px; color: var(--muted); }
  .form-actions .msg.err { color: #ff8a8a; }
  .tag.edited { border-color: rgba(230,160,64,0.45); color: var(--warn); }
  .tag.user { border-color: rgba(144,133,233,0.45); color: var(--accent-hi); }
  .title-line { font-size: 12px; color: var(--ink-2); margin: -4px 0 6px; line-height: 1.4; }
  .notice { font-size: 12px; color: var(--warn); margin-bottom: 10px; }
  .notice a { color: var(--accent-hi); }
  button:disabled { opacity: 0.6; cursor: wait; }
  @media (max-width: 480px) { .form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="icon.svg" alt="">
      <div>
        <h1>Shiden Cards</h1>
        <div class="sub">名刺一覧（ScanSnap → Google Drive → Hayahide-Log）</div>
      </div>
    </div>
    <div class="tools">
      <span class="status" id="status">未設定</span>
      <button class="primary" id="btn-import" title="Google Drive の名刺フォルダから新しい名刺を取り込みます（1〜3 分）">新しい名刺を取り込む</button>
      <button id="btn-sync">再読込</button>
      <button id="btn-csv">CSV出力</button>
      <button id="btn-config">読込設定</button>
    </div>
  </header>

  <section class="panel" id="cfg-panel">
    <h2>GitHub 読込設定（この端末のブラウザにだけ保存されます）</h2>
    <div class="row"><label>owner</label><input id="cfg-owner" placeholder="hayahide-cloud"></div>
    <div class="row"><label>repo</label><input id="cfg-repo" placeholder="Hayahide-Log"></div>
    <div class="row"><label>branch</label><input id="cfg-branch" placeholder="main"></div>
    <div class="row"><label>フォルダ</label><input id="cfg-dir" placeholder="cards"></div>
    <div class="row"><label>token</label><input id="cfg-token" type="password" placeholder="github_pat_…"></div>
    <div class="note">閲覧だけなら Hayahide-Log の Contents「Read-only」で動きます。名刺の項目を編集して保存するには Contents「Read and write」、「新しい名刺を取り込む」ボタンには Actions「Read and write」も必要です。共有 PC では使い終わったら「設定を削除」を押してください。</div>
    <div class="actions">
      <button class="primary" id="cfg-save">保存して読込</button>
      <button id="cfg-clear">設定を削除</button>
    </div>
  </section>

  <div class="notice" id="notice" style="display:none"></div>
  <div class="notice" id="import-msg" style="display:none"></div>

  <div class="filters">
    <input type="search" id="q" placeholder="会社名・氏名・部署・役職・メール・タグ・メモで検索">
    <select id="sort">
      <option value="new">新しい順</option>
      <option value="old">古い順</option>
      <option value="company">会社名順</option>
      <option value="name">氏名順</option>
    </select>
    <select id="tag-filter"><option value="">すべてのタグ</option></select>
    <div class="chips" id="folder-chips"></div>
    <span class="count" id="count"></span>
  </div>

  <div class="section-title" id="list-title">名刺</div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"></div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <img id="modal-img" alt="">
    <div class="meta">
      <div>
        <div class="company" id="modal-company"></div>
        <div class="name" id="modal-name"></div>
        <div class="file" id="modal-file"></div>
      </div>
      <button class="close" id="modal-close">閉じる</button>
    </div>
    <form class="form" id="edit-form" autocomplete="off">
      <label>会社名<input name="company"></label>
      <label>氏名<input name="name"></label>
      <label>部署<input name="dept"></label>
      <label>役職<input name="title"></label>
      <label>電話<input name="phone" inputmode="tel"></label>
      <label>メール<input name="email" inputmode="email"></label>
      <label class="wide">住所<input name="address"></label>
      <label class="wide">タグ<input name="tags" placeholder="例: 取引先, 2026展示会"><span class="hint">カンマ区切り</span></label>
      <label class="wide">メモ<textarea name="memo"></textarea></label>
      <div class="form-actions">
        <button type="submit" class="primary" id="edit-save">保存</button>
        <span class="msg" id="edit-msg">会社名・氏名を空にすると、ファイル名から読んだ値に戻ります</span>
      </div>
    </form>
  </div>
</div>

<script>
(() => {
  /* ============================================================
     データの置き場（Hayahide-Log の cards/）
       cards.json  … PC の scan_cards.py が毎回作り直す一覧（このページは書かない）
       thumbs/     … サムネイル
       edits.json  … このページで手入力した項目（id ごと）。scan_cards.py は触らない
     表示は「cards.json の値の上に edits.json の値を重ねる」。
     保存は GitHub Contents API の PUT。競合（409）は最新を取り直して
     id ごとに updated_at が新しい方を残し、最大 5 回まで再試行する。
     送れなかった編集は localStorage（shiden_cards_pending）に残し、次の読込で再送する。
     ============================================================ */
  const CFG_KEY = "shiden_cards_gh_cfg";
  const PENDING_KEY = "shiden_cards_pending";
  const EDIT_FIELDS = ["company", "name", "dept", "title", "phone", "email", "address", "tags", "memo"];
  const $ = id => document.getElementById(id);

  function getCfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch (e) { return {}; } }
  function setCfg(c) { localStorage.setItem(CFG_KEY, JSON.stringify(c)); }
  function cfgOk(c) { return c && c.owner && c.repo && c.token; }
  function setStatus(msg) { $("status").textContent = msg; }
  function hhmm() { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }

  // UTF-8 と base64 の相互変換（日本語を含む JSON を Contents API で読み書きするため）
  function b64enc(str) { const bytes = new TextEncoder().encode(str); let bin = ""; for (const b of bytes) bin += String.fromCharCode(b); return btoa(bin); }
  function b64dec(b64) { const bin = atob((b64 || "").replace(/\n/g, "")); const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0)); return new TextDecoder().decode(bytes); }

  function filePath(c, path) {
    const dir = (c.dir || "cards").replace(/^\/+|\/+$/g, "");
    return (dir ? dir + "/" : "") + path;
  }
  function apiUrl(c, path, withRef = true) {
    const p = filePath(c, path).split("/").map(encodeURIComponent).join("/");
    const base = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${p}`;
    return withRef ? `${base}?ref=${encodeURIComponent(c.branch || "main")}` : base;
  }
  function authHeaders(c, accept) { return { Authorization: "Bearer " + c.token, Accept: accept || "application/vnd.github+json" }; }
  function ghErr(op, code) {
    const hint = {
      401: "トークンが無効か期限切れ",
      403: op === "PUT" ? "書き込み権限がありません（Contents を Read and write に）" : "権限不足",
      404: op === "PUT" ? "書き込み権限がありません（Repository access に Hayahide-Log を含め、Contents を Read and write に）" : "リポジトリ名・フォルダ名かトークンの対象リポジトリを確認",
      409: "競合（自動で再試行します）",
      422: "リクエスト不正（ブランチ名を確認）",
    }[code];
    return op + " " + code + (hint ? "：" + hint : "");
  }

  // 画像・cards.json は raw で受け取る（base64 を自前で戻すより軽く、1MB 超でも動く）
  async function fetchBlob(c, path, fresh = false) {
    const url = apiUrl(c, path) + (fresh ? "&t=" + Date.now() : "");
    const r = await fetch(url, { cache: fresh ? "no-store" : "default", headers: authHeaders(c, "application/vnd.github.raw+json") });
    if (!r.ok) throw new Error(ghErr("GET", r.status));
    return r.blob();
  }
  // 一覧は取り込み直後に読み直すので、常に最新を取る（画像は変わらないのでキャッシュを使う）
  async function fetchJson(c, path) { return JSON.parse(await (await fetchBlob(c, path, true)).text()); }

  // edits.json は sha も要るので JSON 形式で取る。古い sha だと PUT が 409 になるため常に最新を取る
  async function getEdits(c) {
    const r = await fetch(apiUrl(c, "edits.json") + "&t=" + Date.now(), { cache: "no-store", headers: authHeaders(c) });
    if (r.status === 404) return { data: { version: 1, edits: {} }, sha: null };
    if (!r.ok) throw new Error(ghErr("GET", r.status));
    const j = await r.json();
    const data = JSON.parse(b64dec(j.content));
    if (!data.edits) data.edits = {};
    return { data, sha: j.sha };
  }
  async function putEdits(c, data, sha) {
    const body = { message: "cards edits " + new Date().toISOString(), content: b64enc(JSON.stringify(data, null, 1)), branch: c.branch || "main" };
    if (sha) body.sha = sha;
    const r = await fetch(apiUrl(c, "edits.json", false), { method: "PUT", headers: { ...authHeaders(c), "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(ghErr("PUT", r.status));
    return (await r.json()).content.sha;
  }

  // ---- 状態 ----
  let cards = [];          // cards.json の cards
  let edits = {};          // edits.json の edits（id -> 手入力の項目）
  let folder = "";         // 選択中フォルダ（空=すべて）
  let current = null;      // 拡大表示中のカード id
  const blobUrls = new Map();

  function getPending() { try { return JSON.parse(localStorage.getItem(PENDING_KEY)) || {}; } catch (e) { return {}; } }
  function setPending(p) { localStorage.setItem(PENDING_KEY, JSON.stringify(p)); }

  // 表示用: ファイル名から読んだ値の上に手入力を重ねる（送信待ちの編集が最優先）
  function editOf(id) { return getPending()[id] || edits[id] || null; }
  function view(c) {
    const e = editOf(c.id) || {};
    return {
      ...c,
      company: e.company || c.company || "",
      name: e.name || c.name || "",
      dept: e.dept || "", title: e.title || "", phone: e.phone || "", email: e.email || "",
      address: e.address || "", memo: e.memo || "",
      tags: Array.isArray(e.tags) ? e.tags : [],
      edited: !!editOf(c.id),
    };
  }

  // ---- サムネイルの遅延読み込み（見えたカードだけ API を叩く）----
  const observer = new IntersectionObserver(entries => {
    for (const e of entries) { if (!e.isIntersecting) continue; observer.unobserve(e.target); loadThumb(e.target); }
  }, { rootMargin: "300px" });
  async function thumbUrl(path) {
    if (blobUrls.has(path)) return blobUrls.get(path);
    const url = URL.createObjectURL(await fetchBlob(getCfg(), path));
    blobUrls.set(path, url);
    return url;
  }
  async function loadThumb(el) {
    const path = el.dataset.thumb;
    if (!path) return;
    try { const img = document.createElement("img"); img.src = await thumbUrl(path); img.alt = ""; el.textContent = ""; el.appendChild(img); }
    catch (e) { el.textContent = "画像なし"; }
  }

  // ---- 表示 ----
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
  function fmtDate(iso) { return (iso || "").slice(0, 10).replace(/-/g, "/"); }

  function visibleCards() {
    const q = $("q").value.trim().toLowerCase();
    const tag = $("tag-filter").value;
    let list = cards.map(view).filter(v => (!folder || v.folder === folder) && (!tag || v.tags.includes(tag)) &&
      (!q || [v.company, v.name, v.dept, v.title, v.phone, v.email, v.address, v.memo, v.tags.join(" "), v.file].join(" ").toLowerCase().includes(q)));
    const cmp = {
      new: (a, b) => (b.mtime || "").localeCompare(a.mtime || ""),
      old: (a, b) => (a.mtime || "").localeCompare(b.mtime || ""),
      company: (a, b) => a.company.localeCompare(b.company, "ja") || a.name.localeCompare(b.name, "ja"),
      name: (a, b) => a.name.localeCompare(b.name, "ja"),
    }[$("sort").value];
    return list.sort(cmp);
  }

  function renderChips() {
    const folders = [...new Set(cards.map(c => c.folder || ""))].sort((a, b) => a.localeCompare(b, "ja"));
    const box = $("folder-chips");
    box.innerHTML = "";
    const mk = (label, value) => {
      const b = document.createElement("button");
      b.className = "chip" + (folder === value ? " on" : "");
      b.textContent = label;
      b.addEventListener("click", () => { folder = value; render(); });
      box.appendChild(b);
    };
    mk("すべて", "");
    for (const f of folders) mk(f || "（ルート）", f);
  }
  function renderTagFilter() {
    const sel = $("tag-filter"), keep = sel.value;
    const tags = [...new Set(cards.flatMap(c => view(c).tags))].sort((a, b) => a.localeCompare(b, "ja"));
    sel.innerHTML = '<option value="">すべてのタグ</option>' + tags.map(t => `<option>${esc(t)}</option>`).join("");
    sel.value = tags.includes(keep) ? keep : "";
  }
  function renderNotice() {
    const ids = new Set(cards.map(c => c.id));
    const orphan = Object.keys(edits).filter(id => !ids.has(id)).length;
    const pending = Object.keys(getPending()).length;
    const msgs = [];
    if (pending) msgs.push(`未送信の編集が ${pending} 件あります（再読込で再送します）`);
    if (orphan && cards.length) msgs.push(`元の名刺ファイルが見つからない編集が ${orphan} 件あります（ファイル名を変えると編集が外れます）`);
    $("notice").textContent = msgs.join("　/　");
    $("notice").style.display = msgs.length ? "block" : "none";
  }

  function render() {
    renderChips(); renderTagFilter(); renderNotice();
    const list = visibleCards();
    const grid = $("grid");
    grid.innerHTML = "";
    $("count").textContent = `${list.length} / ${cards.length} 件`;
    $("empty").style.display = list.length ? "none" : "block";
    $("empty").textContent = cards.length ? "該当する名刺がありません" : "名刺がまだ読み込まれていません";
    for (const v of list) {
      const el = document.createElement("div");
      el.className = "card";
      const sub = [v.dept, v.title].filter(Boolean).join(" ");
      el.innerHTML = `
        <div class="thumb" data-thumb="${esc(v.thumb || "")}">${v.thumb ? "読込中…" : "サムネイルなし"}</div>
        <div class="body">
          <div class="company">${esc(v.company || "（会社名なし）")}</div>
          <div class="name">${esc(v.name)}</div>
          ${sub ? `<div class="title-line">${esc(sub)}</div>` : ""}
          <div class="tags">
            ${v.folder ? `<span class="tag folder">${esc(v.folder)}</span>` : ""}
            ${v.tags.map(t => `<span class="tag user">${esc(t)}</span>`).join("")}
            ${v.edited ? '<span class="tag edited">編集済</span>' : ""}
          </div>
          <div class="date">${fmtDate(v.mtime)}</div>
        </div>`;
      el.addEventListener("click", () => openModal(v.id));
      grid.appendChild(el);
      observer.observe(el.querySelector(".thumb"));
    }
  }

  // ---- 拡大表示と編集 ----
  async function openModal(id) {
    const c = cards.find(x => x.id === id);
    if (!c) return;
    current = id;
    const v = view(c);
    $("modal-company").textContent = v.company;
    $("modal-name").textContent = v.name;
    $("modal-file").textContent = (c.folder ? c.folder + "/" : "") + c.file;
    const f = $("edit-form");
    for (const k of EDIT_FIELDS) f.elements[k].value = k === "tags" ? v.tags.join(", ") : v[k];
    setMsg("会社名・氏名を空にすると、ファイル名から読んだ値に戻ります");
    const img = $("modal-img");
    img.removeAttribute("src");
    $("modal").classList.add("open");
    if (c.thumb) { try { img.src = await thumbUrl(c.thumb); } catch (e) { /* 画像なしのまま */ } }
  }
  function closeModal() { $("modal").classList.remove("open"); current = null; }
  function setMsg(text, err) { const m = $("edit-msg"); m.textContent = text; m.className = "msg" + (err ? " err" : ""); }

  // フォームの値から edits.json に入れる 1 件を作る。ファイル名から読んだ値と同じ・空の項目は保存しない
  function recordFromForm(c) {
    const f = $("edit-form"), rec = {};
    for (const k of EDIT_FIELDS) {
      const raw = f.elements[k].value.trim();
      if (k === "tags") { const t = [...new Set(raw.split(/[,、，]/).map(s => s.trim()).filter(Boolean))]; if (t.length) rec.tags = t; continue; }
      if (!raw) continue;
      if ((k === "company" || k === "name") && raw === (c[k] || "")) continue;
      rec[k] = raw;
    }
    rec.updated_at = new Date().toISOString();
    return rec;
  }

  $("edit-form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const c = cards.find(x => x.id === current);
    if (!c) return;
    const rec = recordFromForm(c);
    const empty = Object.keys(rec).length === 1; // updated_at だけ＝手入力なし
    const pending = getPending();
    // 手入力を全部消したときは「削除」として送る（edits.json から id ごと消す）
    pending[c.id] = empty ? { _deleted: true, updated_at: rec.updated_at } : rec;
    setPending(pending);
    render();
    setMsg("保存中…");
    try { await flushPending(); setMsg("保存しました " + hhmm()); setStatus("保存 " + hhmm()); }
    catch (e) { setMsg("保存できませんでした: " + e.message + "（この端末に残して次回再送します）", true); }
    const v = view(c);
    $("modal-company").textContent = v.company;
    $("modal-name").textContent = v.name;
    render();
  });

  // 送信待ちの編集を edits.json に書き込む。最新を取り直して id ごとに新しい方を残す
  let flushing = false;
  async function flushPending() {
    const c = getCfg();
    if (!cfgOk(c) || flushing) return;
    let pending = getPending();
    if (!Object.keys(pending).length) return;
    flushing = true;
    try {
      let lastErr;
      for (let i = 0; i < 5; i++) {
        try {
          const remote = await getEdits(c);
          const merged = remote.data;
          merged.version = 1;
          for (const [id, rec] of Object.entries(pending)) {
            const cur = merged.edits[id];
            if (cur && (cur.updated_at || "") > (rec.updated_at || "")) continue; // 他端末の方が新しい
            if (rec._deleted) delete merged.edits[id]; else merged.edits[id] = rec;
          }
          merged.updated_at = new Date().toISOString();
          await putEdits(c, merged, remote.sha);
          edits = merged.edits;
          // 送信中に増えた編集は残す
          const now = getPending();
          for (const id of Object.keys(pending)) if (now[id] && now[id].updated_at === pending[id].updated_at) delete now[id];
          setPending(now);
          return;
        } catch (e) {
          lastErr = e;
          if (!/\b409\b/.test(e.message)) throw e;
          pending = getPending();
        }
      }
      throw lastErr;
    } finally { flushing = false; renderNotice(); }
  }

  $("modal-close").addEventListener("click", closeModal);
  $("modal").addEventListener("click", e => { if (e.target === $("modal")) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  // ---- CSV 出力（Excel で開けるよう BOM 付き UTF-8）----
  function csvCell(v) { const s = String(v ?? ""); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  $("btn-csv").addEventListener("click", () => {
    if (!cards.length) { setStatus("名刺が読み込まれていません"); return; }
    const head = ["会社名", "氏名", "部署", "役職", "電話", "メール", "住所", "タグ", "メモ", "フォルダ", "ファイル名", "取込日"];
    const rows = visibleCards().map(v => [v.company, v.name, v.dept, v.title, v.phone, v.email, v.address, v.tags.join(" / "), v.memo, v.folder, v.file, fmtDate(v.mtime)]);
    const csv = "\ufeff" + [head, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    const d = new Date();
    a.download = `shiden-cards-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setStatus(`CSV 出力 ${rows.length} 件`);
  });

  // ---- 読込 ----
  let syncing = false;
  async function sync() {
    const c = getCfg();
    if (!cfgOk(c)) { setStatus("未設定（読込設定を入力してください）"); return; }
    if (syncing) return;
    syncing = true; setStatus("読込中…");
    try {
      const [data, ed] = await Promise.all([fetchJson(c, "cards.json"), getEdits(c)]);
      cards = Array.isArray(data.cards) ? data.cards : [];
      edits = ed.data.edits;
      $("list-title").textContent = `名刺（更新 ${fmtDate(data.generated_at)}）`;
      render();
      setStatus("更新 " + hhmm());
      if (Object.keys(getPending()).length) {
        try { await flushPending(); setStatus("更新・再送 " + hhmm()); render(); }
        catch (e) { setStatus("再送失敗: " + e.message); }
      }
    } catch (e) {
      setStatus("読込失敗: " + e.message);
    } finally { syncing = false; }
  }

  // ---- 新しい名刺を取り込む（GitHub Actions の取り込みを手動で 1 回動かす）----
  // Google の鍵は Hayahide-Log の Actions secrets にだけ置き、ブラウザには渡さない。
  // このページはワークフローを起動して終わるのを待ち、終わったら一覧を読み直すだけ。
  const WORKFLOW_FILE = "shiden-cards-sync.yml";
  const IMPORT_TIMEOUT_MS = 15 * 60 * 1000;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function repoApi(c, path, opts = {}) {
    const headers = { ...authHeaders(c), ...(opts.body ? { "Content-Type": "application/json" } : {}) };
    const sep = path.includes("?") ? "&" : "?";
    const url = `https://api.github.com/repos/${c.owner}/${c.repo}${path}` + (opts.method ? "" : `${sep}t=${Date.now()}`);
    return fetch(url, { cache: "no-store", ...opts, headers });
  }
  function importErr(op, code) {
    const hint = {
      401: "トークンが無効か期限切れ",
      403: "トークンに Actions の権限がありません（Actions を Read and write に）",
      404: "取り込み用のワークフローが Hayahide-Log に無いか、トークンに Actions の権限がありません",
      422: "ワークフローが手動実行に対応していないか、ブランチ名が違います",
    }[code];
    return op + " " + code + (hint ? "：" + hint : "");
  }
  async function listRuns(c) {
    const r = await repoApi(c, `/actions/workflows/${WORKFLOW_FILE}/runs?event=workflow_dispatch&per_page=10`);
    if (!r.ok) throw new Error(importErr("確認", r.status));
    return (await r.json()).workflow_runs || [];
  }
  async function getRun(c, id) {
    const r = await repoApi(c, `/actions/runs/${id}`);
    if (!r.ok) throw new Error(importErr("確認", r.status));
    return r.json();
  }
  function showImportMsg(text, link) {
    const el = $("import-msg");
    el.textContent = text;
    if (link) {
      el.append(" ");
      const a = document.createElement("a");
      a.href = link; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Actions のログを開く";
      el.append(a);
    }
    el.style.display = text ? "block" : "none";
  }

  let importing = false;
  async function importCards() {
    const c = getCfg();
    if (!cfgOk(c)) { setStatus("未設定（読込設定を入力してください）"); return; }
    if (importing) return;
    importing = true;
    const btn = $("btn-import");
    btn.disabled = true;
    showImportMsg("");
    const before = new Set(cards.map(x => x.id));
    try {
      const runs = await listRuns(c);
      // すでに動いている取り込みがあれば、二重に起動せずにそれを待つ
      let run = runs.find(x => x.status !== "completed") || null;
      if (!run) {
        const known = new Set(runs.map(x => x.id));
        setStatus("取り込みを依頼中…");
        const r = await repoApi(c, `/actions/workflows/${WORKFLOW_FILE}/dispatches`, { method: "POST", body: JSON.stringify({ ref: c.branch || "main" }) });
        if (r.status !== 204) throw new Error(importErr("起動", r.status));
        // 起動した実行が一覧に出るまで数秒かかる。起動前に無かった実行を探す（端末の時計に頼らない）
        for (let i = 0; i < 24 && !run; i++) {
          await sleep(5000);
          run = (await listRuns(c)).find(x => !known.has(x.id)) || null;
        }
        if (!run) throw new Error("取り込みが始まりません。しばらくしてから「再読込」を押すか、GitHub の Actions 画面を確認してください");
      }
      const deadline = Date.now() + IMPORT_TIMEOUT_MS;
      while (run.status !== "completed") {
        setStatus(run.status === "in_progress" ? "取り込み中…（Google Drive から読み込んでいます）" : "取り込み待ち…");
        if (Date.now() > deadline) throw Object.assign(new Error("15 分たっても終わりません"), { url: run.html_url });
        await sleep(5000);
        run = await getRun(c, run.id);
      }
      if (run.conclusion !== "success") throw Object.assign(new Error("取り込みに失敗しました（" + run.conclusion + "）"), { url: run.html_url });
      await sync();
      const added = cards.filter(x => !before.has(x.id)).length;
      const msg = added ? `取り込み完了: 新しい名刺 ${added} 件` : "取り込み完了: 新しい名刺はありません";
      setStatus(msg + " " + hhmm());
      showImportMsg("");
    } catch (e) {
      setStatus("取り込み失敗");
      showImportMsg("取り込みできませんでした: " + e.message, e.url);
    } finally {
      importing = false;
      btn.disabled = false;
    }
  }
  $("btn-import").addEventListener("click", importCards);

  // ---- 設定パネル ----
  function fillCfg() {
    const c = getCfg();
    $("cfg-owner").value = c.owner || "hayahide-cloud";
    $("cfg-repo").value = c.repo || "Hayahide-Log";
    $("cfg-branch").value = c.branch || "main";
    $("cfg-dir").value = c.dir || "cards";
    $("cfg-token").value = c.token || "";
  }
  $("btn-config").addEventListener("click", () => { fillCfg(); $("cfg-panel").classList.toggle("open"); });
  $("cfg-save").addEventListener("click", () => {
    setCfg({
      owner: $("cfg-owner").value.trim(),
      repo: $("cfg-repo").value.trim(),
      branch: $("cfg-branch").value.trim() || "main",
      dir: $("cfg-dir").value.trim() || "cards",
      token: $("cfg-token").value.trim(),
    });
    $("cfg-panel").classList.remove("open");
    sync();
  });
  $("cfg-clear").addEventListener("click", () => {
    const pending = Object.keys(getPending()).length;
    if (pending && !confirm(`未送信の編集が ${pending} 件あります。設定と一緒に消しますか？`)) return;
    localStorage.removeItem(CFG_KEY); localStorage.removeItem(PENDING_KEY); fillCfg();
    cards = []; edits = {}; render(); setStatus("設定を削除しました");
  });
  $("btn-sync").addEventListener("click", sync);
  $("q").addEventListener("input", render);
  $("sort").addEventListener("change", render);
  $("tag-filter").addEventListener("change", render);

  render();
  if (cfgOk(getCfg())) sync();
  else { setStatus("未設定（読込設定を入力してください）"); fillCfg(); $("cfg-panel").classList.add("open"); }
})();
</script>
</body>
</html>
